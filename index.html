<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vakantie 2024</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="book-container">
        <!-- Book Cover -->
        <div class="book-cover" id="bookCover">
            <div class="cover-content">
                <h1 class="cover-title">Vakantie 2024</h1>
                <p class="cover-subtitle">Klik om te openen</p>
            </div>
        </div>

        <!-- Book Content -->
        <div class="book" id="book">
            <div class="book-page-title" id="pageTitle"></div>
            <div class="book-pages">
                <!-- Left Page -->
                <div class="page left-page">
                    <div class="page-content" id="leftPage"></div>
                    <div class="page-number">-</div>
                </div>

                <!-- Right Page -->
                <div class="page right-page">
                    <div class="page-content" id="rightPage"></div>
                    <div class="page-number" id="pageNum">1</div>
                </div>
            </div>

            <!-- Table of Contents Container -->
            <div id="tocContainer" style="display: none;"></div>

            <!-- Navigation Controls -->
            <div class="book-controls">
                <button class="book-btn prev-page-btn" onclick="previousPage()" title="Previous">‹</button>
                <span class="page-indicator" id="pageIndicator">Page 1</span>
                <button class="book-btn next-page-btn" onclick="nextPage()" title="Next">›</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <button class="close-btn" onclick="closeLightbox()">&times;</button>
            <div class="lightbox-media-container">
                <img id="lightbox-image" class="lightbox-media" style="display: none;" alt="Full size image">
                <video id="lightbox-video" class="lightbox-media" style="display: none;" controls>
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="lightbox-nav">
                <button class="nav-btn prev-btn" onclick="prevMedia()">&lt; Prev</button>
                <span id="image-counter" class="image-counter"></span>
                <button class="nav-btn next-btn" onclick="nextMedia()">Next &gt;</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
